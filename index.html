<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tenka 天下</title>
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#13152f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tenka">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
@font-face { font-family: 'Shippori'; src: url(fonts/mincho-400.woff2) format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Shippori'; src: url(fonts/mincho-700.woff2) format('woff2'); font-weight: 700; font-display: swap; }
@font-face { font-family: 'Zen'; src: url(fonts/gothic-400.woff2) format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Zen'; src: url(fonts/gothic-500.woff2) format('woff2'); font-weight: 500; font-display: swap; }

/* the Indigo Cloth world of the Sengoku map: indigo for ground and sea, clan dyes for land, cream cotton for text */
:root {
  --kachi: #13152f; --kon: #1a1e47; --hanada: #33478a; --lining: #16193a; --lining-2: #1c2046;
  --cream: #efe6d3; --undyed: #e2d9c5; --muted: #adb2d2; --faint: #8f94b8; --line: rgba(239, 230, 211, .14); --seam: rgba(239, 230, 211, .32);
  --ink: #13152f; --ink-soft: #4a4a63;
  --mincho: 'Shippori', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
  --gothic: 'Zen', 'Yu Gothic UI', 'Hiragino Sans', sans-serif;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --col: 460px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--kachi); scrollbar-color: var(--hanada) var(--kachi); scrollbar-width: thin; }
body { margin: 0; color: var(--cream); background: var(--kachi); font: 400 15px/1.55 var(--gothic); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
::selection { background: var(--hanada); color: var(--cream); }
:focus-visible { outline: 1.5px dashed var(--cream); outline-offset: 3px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
p, h1, h2, h3 { margin: 0; }
h1, h2, h3 { font-family: var(--mincho); font-weight: 700; }
[lang="ja"] { font-family: var(--mincho); }
.num { font-variant-numeric: tabular-nums lining-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- the map: a strip at the head of the scroll; it unrolls when you choose a province ---------- */
#cloth {
  position: relative; height: clamp(210px, 31dvh, 320px); overflow: hidden; transition: height .6s var(--ease);
  background:
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .02) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0, 0, 0, .07) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse 70% 75% at 58% 52%, #252c63 0%, var(--kon) 50%, var(--kachi) 100%);
}
body.open #cloth { height: calc(100dvh - 150px); }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
body.open #map { touch-action: none; }
.prov use { stroke: var(--cream); stroke-opacity: .4; stroke-width: .7; vector-effect: non-scaling-stroke; }
body.open .prov.can use { cursor: pointer; }
#ezo use { fill: #252b5e; stroke: none; }
#lakes use { fill: #262f68; stroke: var(--cream); stroke-opacity: .35; stroke-width: .6; vector-effect: non-scaling-stroke; }
#mottle { pointer-events: none; mix-blend-mode: multiply; opacity: .5; }
#sea-waves { opacity: .055; pointer-events: none; }
#soak, #mine, #can, #crests, #labels, #lakes { pointer-events: none; }
#mine use { fill: none; stroke: var(--cream); stroke-width: 1.8; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
#can use { fill: rgba(239, 230, 211, .22); stroke: var(--cream); stroke-width: 1.6; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; animation: breathe 2.4s ease-in-out infinite; }
#can use.sel { fill: rgba(239, 230, 211, .32); stroke-width: 2.6; stroke-dasharray: none; animation: none; }
@keyframes breathe { 50% { fill: rgba(239, 230, 211, .4); } }
.crest { opacity: .8; mix-blend-mode: screen; }
.prov-label { font-family: var(--mincho); fill: var(--cream); paint-order: stroke; stroke: rgba(19, 21, 47, .85); stroke-linejoin: round; }

#house {
  position: absolute; left: 14px; top: calc(12px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 10px; text-align: left;
  padding: 5px 14px 5px 5px; border-radius: 30px; background: rgba(19, 21, 47, .9); box-shadow: 0 4px 14px rgba(0, 0, 0, .3);
}
.disc { width: 34px; height: 34px; flex: none; border-radius: 50%; display: block; box-shadow: 0 0 0 1.5px rgba(239, 230, 211, .55); }
.disc.kanji { background: var(--undyed); color: var(--ink); font: 700 1rem/1 var(--mincho); display: grid; place-items: center; box-shadow: none; }
#house b { display: block; font: 700 1.12rem/1.15 var(--mincho); }
#house small { display: block; font-size: .78rem; color: var(--muted); line-height: 1.3; }
.pill {
  position: absolute; right: 12px; bottom: 12px; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 7px 16px;
  border-radius: 22px; background: var(--cream); color: var(--ink); font-weight: 500; font-size: .9rem; box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
}
.pill[hidden] { display: none; }
.pill svg { width: 15px; height: 15px; }
#mapclose { position: absolute; right: 12px; top: calc(12px + env(safe-area-inset-top)); width: 40px; height: 40px; border-radius: 50%; background: rgba(19, 21, 47, .78); border: 1.5px solid rgba(239, 230, 211, .5); display: none; place-items: center; }
#mapclose svg { width: 14px; height: 14px; stroke: var(--cream); stroke-width: 1.8; }
body.open #mapclose { display: grid; }
body.open #house, body.open #reachpill { display: none; }

/* the choice bar under the open map */
#choose { display: none; padding: 14px 18px 16px; background: var(--lining); border-bottom: 1px dashed var(--seam); }
body.open #choose { display: block; }
#choose h2 { font-size: 1.25rem; line-height: 1.2; }
#choose h2 span { font-weight: 400; color: var(--muted); margin-left: 6px; }
#choose p { color: var(--muted); font-size: .88rem; margin-top: 3px; }
#choose .btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

/* ---------- the present: year, money, the one next thing to do ---------- */
main { max-width: var(--col); margin: 0 auto; }
#now { padding: 18px 18px 6px; }
.when { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
#year { font: 700 3.4rem/.9 var(--mincho); letter-spacing: -.02em; }
.era { text-align: right; padding-bottom: 2px; }
.era b { display: block; font: 400 1.15rem/1.2 var(--mincho); }
.era span { display: block; font-size: .8rem; color: var(--muted); }
.wealth { margin-top: 10px; font-size: 1.06rem; }
.wealth .rate, .pace { color: var(--muted); }
.pace { font-size: .84rem; margin-top: 1px; }

.away { margin: 14px 0 0; padding: 12px 14px; border: 1px dashed var(--seam); border-radius: 4px; font-size: .9rem; position: relative; }
.away h2 { font-size: 1.05rem; margin-bottom: 2px; padding-right: 30px; }
.away p { color: var(--muted); }
.away .x { position: absolute; right: 6px; top: 6px; width: 32px; height: 32px; display: grid; place-items: center; }
.away .x svg { width: 12px; height: 12px; stroke: var(--muted); stroke-width: 1.8; }

.next {
  margin-top: 16px; width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; border-radius: 6px;
  background: var(--cream); color: var(--ink); box-shadow: 0 8px 22px rgba(0, 0, 0, .28); transition: transform .12s, background .15s, opacity .2s;
}
.next:hover { background: #fff8e8; }
.next:active { transform: scale(.985); }
.next .g { font: 700 2.8rem/1 var(--mincho); flex: none; width: 48px; text-align: center; }
.next .t { flex: 1; min-width: 0; }
.next .t b { display: block; font: 700 1.25rem/1.2 var(--mincho); }
.next .t > span { display: block; font-size: .84rem; color: var(--ink-soft); }
.next .c { text-align: right; font-weight: 500; font-size: 1.02rem; white-space: nowrap; }
.next .c small { display: block; font-weight: 400; font-size: .76rem; color: var(--ink-soft); }
.next.wait { background: rgba(239, 230, 211, .1); color: var(--cream); box-shadow: none; border: 1px dashed var(--seam); cursor: default; }
.next.wait .t > span, .next.wait .c small { color: var(--muted); }
.next.stamp .g { animation: stamp .35s var(--ease); }
@keyframes stamp { 0% { transform: scale(1.18); } 100% { transform: none; } }
.all { display: block; margin: 8px auto 0; padding: 8px 12px; font-size: .86rem; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--seam); }
.all:hover { color: var(--cream); }
.all[hidden] { display: none; }
.hint { margin-top: 12px; font-size: .88rem; color: var(--muted); }
.hint b { color: var(--cream); font-weight: 500; }

.trades { margin-top: 10px; }
.trade { width: 100%; display: flex; align-items: baseline; gap: 10px; text-align: left; padding: 11px 2px; border-bottom: 1px solid var(--line); }
.trade:last-child { border-bottom: 0; }
.trade .g { font: 700 1.1rem/1 var(--mincho); width: 20px; flex: none; }
.trade .n { flex: 1; min-width: 0; }
.trade .n small { color: var(--muted); font-size: .82rem; }
.trade .c { color: var(--muted); font-size: .9rem; white-space: nowrap; }
.trade.can .c { color: var(--cream); }
.trade.shut { cursor: default; color: var(--faint); }
.trade.shut .c, .trade.shut small { color: var(--faint); }
.trade:not(.shut):hover .n { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--seam); }
details.earlier { padding: 4px 2px 0; font-size: .88rem; color: var(--muted); }
details.earlier summary { cursor: pointer; padding: 8px 0; list-style: none; display: flex; align-items: center; gap: 8px; }
details.earlier summary::-webkit-details-marker { display: none; }
details.earlier summary svg { width: 10px; height: 10px; flex: none; transition: transform .2s var(--ease); }
details.earlier[open] summary svg { transform: rotate(90deg); }

.present { margin-top: 16px; padding: 16px; border: 1px solid var(--seam); border-radius: 6px; }
.present h2 { font-size: 1.35rem; }
.present p { color: var(--muted); margin: 4px 0 12px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 8px 18px; border-radius: 22px; border: 1.5px solid rgba(239, 230, 211, .5); font-size: .92rem; font-weight: 500; transition: background .15s, border-color .15s; }
.btn:hover:not(:disabled) { border-color: var(--cream); background: rgba(239, 230, 211, .07); }
.btn.go { background: var(--cream); color: var(--ink); border-color: var(--cream); }
.btn.go:hover:not(:disabled) { background: #fff8e8; }
.btn:disabled { opacity: .4; cursor: default; }

/* ---------- the chronicle ---------- */
.seam { border: 0; border-top: 2px dashed var(--seam); margin: 18px 0 0; }
#chron { padding: 18px 18px 8px; }
#chron > h2, #housepage > h2 { font-size: 1.25rem; display: flex; align-items: baseline; gap: 8px; }
#chron > h2 span, #housepage > h2 span { font-weight: 400; color: var(--muted); font-size: 1rem; }
.entries { list-style: none; margin: 10px 0 0; padding: 0; }
.entry { display: grid; grid-template-columns: 46px 1fr; gap: 0 12px; padding: 14px 0; border-bottom: 1px dashed var(--line); }
.entry .y { font: 700 1rem/1.4 var(--mincho); color: var(--muted); text-align: right; padding-top: 2px; }
.entry .disc { width: 38px; height: 38px; margin: 8px 0 0 auto; }
.entry .disc.kanji { font-size: 1.05rem; }
.entry h3 { font-size: 1.12rem; line-height: 1.3; word-break: keep-all; text-wrap: balance; }
.nb { white-space: nowrap; }
.note { color: var(--muted); font-size: .9rem; margin: -2px 0 10px; }
.note.after { margin: 14px 0 0; }
.entry .where { font-size: .82rem; color: var(--muted); margin-top: 1px; }
.entry .story { font-family: var(--mincho); font-size: 1rem; line-height: 1.65; margin-top: 7px; color: #ddd5c4; max-width: 62ch; }
.entry .gift { font-size: .8rem; color: var(--muted); margin-top: 6px; }
.entry.unread { border-bottom-style: dashed; }
.entry.unread h3 { color: var(--cream); }
.entry.unread .btn { margin-top: 10px; }
.entry.house h3 { font: 400 .98rem/1.45 var(--gothic); color: var(--muted); }
.entry.house .y { font-weight: 400; }
.entry.fresh { animation: settle .8s var(--ease); }
@keyframes settle { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
.more { display: block; margin: 12px auto 0; }

/* ---------- the house: heads, treasures, saving ---------- */
#housepage { padding: 22px 18px calc(36px + env(safe-area-inset-bottom)); }
.facts { margin-top: 10px; display: grid; gap: 4px; font-size: .92rem; }
.facts p { color: var(--muted); }
.facts b { color: var(--cream); font-weight: 500; }
h3.sub { font-size: 1.02rem; margin: 22px 0 8px; }
.heads { list-style: none; padding: 0; margin: 0; font-size: .9rem; color: var(--muted); columns: 2; column-gap: 18px; }
.heads li { padding: 2px 0; break-inside: avoid; }
.heads b { color: var(--cream); font-weight: 400; }
.treasures { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
.tr { border: 1px solid var(--line); border-radius: 4px; padding: 10px; font-size: .8rem; color: var(--muted); }
.tr b { display: block; font: 700 .95rem/1.25 var(--mincho); color: var(--cream); }
.tr.gone { border-style: dashed; display: grid; place-items: center; min-height: 76px; color: var(--faint); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.credits { margin-top: 22px; font-size: .76rem; color: var(--faint); line-height: 1.5; }
.credits a { color: var(--muted); text-underline-offset: 2px; }

/* ---------- choosing a house (the first screen) ---------- */
#pick { position: fixed; inset: 0; z-index: 10; overflow-y: auto;
  background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .02) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(0, 0, 0, .07) 0 1px, transparent 1px 3px), radial-gradient(ellipse 80% 60% at 50% 0%, #252c63 0%, var(--kon) 45%, var(--kachi) 100%) fixed; padding: calc(28px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom)); }
#pick[hidden] { display: none; }
#pick .in { max-width: 560px; margin: 0 auto; }
#pick h1 { font-size: 2.2rem; line-height: 1.1; }
#pick h1 span { display: block; font-size: 1.1rem; font-weight: 400; color: var(--muted); margin-top: 6px; }
#pick .lede { font-family: var(--mincho); font-size: 1.05rem; line-height: 1.65; margin-top: 14px; color: #ddd5c4; padding-bottom: 18px; border-bottom: 2px dashed var(--seam); }
.houses { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 18px; }
.houses button { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; padding: 12px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--lining); }
.houses button:hover { border-color: rgba(239, 230, 211, .5); }
.houses button[aria-pressed="true"] { border-color: var(--cream); background: var(--lining-2); }
.houses .disc { width: 44px; height: 44px; }
.houses b { font: 700 1.08rem/1.2 var(--mincho); }
.houses small { font-size: .8rem; color: var(--muted); line-height: 1.35; }
.chosen { margin-top: 16px; padding: 14px 16px; border: 1px solid var(--seam); border-radius: 6px; }
.chosen p { color: var(--muted); font-size: .9rem; margin-top: 2px; }
.chosen .btn { margin-top: 12px; width: 100%; }

#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 5; pointer-events: none; }
#toast span { display: block; background: var(--cream); color: var(--ink); border-radius: 22px; padding: 8px 18px; font-weight: 500; font-size: .9rem; box-shadow: 0 8px 22px rgba(0, 0, 0, .35); animation: toast 2.6s var(--ease) forwards; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; transform: translateY(10px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* ---------- wide screens: the map holds the left, the scroll runs on the right ---------- */
@media (min-width: 900px) {
  body { display: grid; grid-template-columns: 1fr minmax(400px, 480px); height: 100dvh; overflow: hidden; }
  #cloth, body.open #cloth { height: 100dvh; grid-row: 1 / 3; }
  #scroll { overflow-y: auto; height: 100dvh; border-left: 1px dashed var(--seam); }
  #choose { position: absolute; left: 18px; bottom: 18px; width: min(440px, calc(100vw - 540px)); border: 1px solid var(--seam); border-radius: 6px; z-index: 2; }
  #now { padding-top: 26px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<header id="cloth">
  <svg id="map" role="img" aria-label="Map of Japan's provinces, your house's land stitched in cream"></svg>
  <button id="house" aria-label="Your house"></button>
  <button id="reachpill" class="pill" hidden></button>
  <button id="mapclose" aria-label="Close the map"><svg viewBox="0 0 14 14" fill="none"><path d="M1 1l12 12M13 1L1 13"/></svg></button>
</header>
<div id="choose" aria-live="polite"></div>
<div id="scroll">
  <main>
    <section id="now" aria-label="The present"></section>
    <hr class="seam">
    <section id="chron" aria-label="Chronicle"></section>
    <hr class="seam">
    <section id="housepage" aria-label="The house"></section>
  </main>
</div>
<div id="pick" hidden></div>
<div id="toast" aria-live="polite"></div>
<script src="data/map.js"></script>
<script src="data/game-data.js"></script>
<script src="game.js"></script>
<script src="ui.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
